services:
  # Conteneur Apache/PHP qui sert les fichiers du dossier backend.
  php:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy

  # Base de donnees locale ; le schema SQL est charge au premier demarrage.
  mysql:
    image: mariadb:11
    env_file:
      - .env.docker
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web pratique pour inspecter MySQL pendant le developpement.
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

volumes:
  # Volume persistant pour garder les donnees MySQL entre deux demarrages.
  mysql_data:
