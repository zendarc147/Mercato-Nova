<VirtualHost *:80>
    # Apache sert directement le dossier backend monte dans le conteneur.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # AllowOverride All permet a un .htaccess de definir les regles d'URL si besoin.
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
